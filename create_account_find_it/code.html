<style>
        /* Ambient subtle mesh gradient to avoid plain solid background while remaining dark */
        .ambient-mesh {
            background-color: #131313;
            background-image: 
                radial-gradient(at 20% 30%, rgba(255, 255, 255, 0.03) 0px, transparent 50%),
                radial-gradient(at 80% 80%, rgba(255, 255, 255, 0.02) 0px, transparent 50%);
            background-attachment: fixed;
        }
        
        /* Subtle glow for the logo */
        .logo-glow {
            box-shadow: 0 0 24px rgba(255, 255, 255, 0.1);
        }
    </style>

<body class="ambient-mesh text-on-surface font-body min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased">
<!-- Main Authentication Container (Glassmorphism) -->
<main class="w-full max-w-[420px] bg-surface-container-low/60 backdrop-blur-2xl border border-outline-variant/30 rounded-xl p-lg md:p-xl flex flex-col items-center shadow-2xl relative overflow-hidden">
<!-- Optional edge highlight for glass effect -->
<div class="absolute top-0 inset-x-0 h-px bg-gradient-to-r from-transparent via-primary/20 to-transparent"></div>
<!-- Brand Logo Mark -->
<div class="mb-lg flex items-center justify-center w-14 h-14 bg-surface-container-highest rounded-full logo-glow border border-outline-variant/50">
<img src="https://lh3.googleusercontent.com/aida/AP1WRLuO-OUHn-GuuHP1Sl-bPBgPx8aFyns3vKzvvkxAAZ4HsztLLjekOPHeNbjrNNoXpir7T-ALaysYoV-AJ46UF0DYd4JEoDxANZlGYT2KQxJT7YHlXoyPEkrIZB_DU50nSPm1wt8hUUoUmFMXN39vSvShVBRxUflSBVwxtQTUdomevjbJZUg4dxFz7Kf8FAbwbQB7VyPZHRg0wndq8PlQ485gVTkUqq-iSkAO41MY5Sw7b1FyEBcqSArZ45k" alt="Find It Logo" class="w-8 h-8 object-contain">
</div>
<!-- Headings -->
<div class="text-center mb-xl w-full">
<h1 class="font-headline font-bold text-headline-lg-mobile md:text-headline-lg text-primary tracking-tight mb-xs">
                Join Find It
            </h1>
<p class="text-body-md text-on-surface-variant">
                Reconnect with what matters.
            </p>
</div>
<!-- Registration Form -->
<form action="#" class="w-full flex flex-col gap-md" method="POST">
<!-- Full Name Field -->
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none transition-colors group-focus-within:text-primary text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'wght' 300;">person</span>
</div>
<input class="block w-full pl-[44px] pr-md py-3 bg-surface-container-highest border border-outline-variant/40 rounded-lg text-body-md text-on-surface placeholder-on-surface-variant/60 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all duration-200" id="fullname" name="fullname" placeholder="Full Name" required="" type="text">
</div>
<!-- Email Field -->
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none transition-colors group-focus-within:text-primary text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'wght' 300;">mail</span>
</div>
<input class="block w-full pl-[44px] pr-md py-3 bg-surface-container-highest border border-outline-variant/40 rounded-lg text-body-md text-on-surface placeholder-on-surface-variant/60 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all duration-200" id="email" name="email" placeholder="Email Address" required="" type="email">
</div>
<!-- Password Field -->
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none transition-colors group-focus-within:text-primary text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'wght' 300;">lock</span>
</div>
<input class="block w-full pl-[44px] pr-md py-3 bg-surface-container-highest border border-outline-variant/40 rounded-lg text-body-md text-on-surface placeholder-on-surface-variant/60 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all duration-200" id="password" name="password" placeholder="Password" required="" type="password">
</div>
<!-- Primary CTA -->
<button class="mt-sm w-full flex justify-center items-center py-3 px-4 bg-primary text-on-primary rounded-full font-label text-[14px] uppercase tracking-wider font-semibold hover:bg-primary-fixed-dim focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-background focus:ring-primary transition-all duration-200 active:scale-[0.98]" type="submit">
                Create Account
            </button>
</form>
<!-- Footer Link -->
<div class="mt-xl text-center w-full pt-md border-t border-outline-variant/20">
<p class="text-body-md text-on-surface-variant">
                Already have an account? 
                <a class="font-medium text-primary hover:text-primary-fixed transition-colors" href="#">Sign In</a>
</p>
</div>
</main>
